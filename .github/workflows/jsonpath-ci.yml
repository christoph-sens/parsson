name: JSONPath integration branch CI

# CI for the `jsonpath` integration branch: Maven build + unchanged JSON-P TCK (tck-impl, TCK 2.1.1).
#
# The branch implements JSONPath (RFC 9535) against the JSON-P API 2.2.0-SNAPSHOT from christoph-sens/jsonp-api,
# branch jsonpath, which is not published anywhere; each job builds and installs it first.
#
# JDK 11 is not in the matrix: the JSON-P API 2.2 is compiled for Java 17 (jakartaee/jsonp-api master moved to
# release 17 in November 2025), so Parsson built against it cannot run on JDK 11. Parsson's own classes are still
# compiled for Java 8.
#
# The signature test of TCK 2.1.1 is skipped: it requires the package jakarta.json to have exactly the 2.1
# signature, and API 2.2 adds JsonPath, Json.createPath and JsonProvider.createPath. The 2.2 signature is checked
# by the TCK in christoph-sens/jsonp-api. All other tests of TCK 2.1.1 run unchanged.
on:
  push:
    branches: [ jsonpath ]
  pull_request:
    branches: [ jsonpath ]

concurrency:
  group: jsonpath-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-tck:
    name: JDK ${{ matrix.java_version }} / TCK ${{ matrix.test_suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java_version: [ 17, 21, 25 ]
        test_suite: [ mods, standalone ]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the JSON-P API with JSONPath (christoph-sens/jsonp-api, branch jsonpath)
        uses: actions/checkout@v4
        with:
          repository: christoph-sens/jsonp-api
          ref: jsonpath
          path: jsonp-api
      - name: Set up JDK 17 (builds the API)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and install JSON-P API 2.2.0-SNAPSHOT
        run: mvn -B -V -U -C -f jsonp-api/api/pom.xml -Poss-release install -DskipTests -Dgpg.skip=true
      # No `cache: maven` here: restoring the cache a second time would overwrite the API just installed
      # with the 2.2.0-SNAPSHOT of an earlier run. The first setup-java restores and saves the cache.
      - name: Set up JDK ${{ matrix.java_version }} (build and test JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
      - name: Remember test JDK
        run: echo "TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Build Parsson
        run: mvn -B -V -U -C -Poss-release,staging clean verify -Dgpg.skip=true
      - name: Prepare distribution
        run: unzip -q -d image bundles/dist/target/parsson-dist.zip
      - name: Set up JDK 17 (runs Gradle 7.6.5, which cannot run on JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: JSON-P TCK against Parsson
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.5
      - name: Run TCK
        run: gradle -p tck-impl check -x signatureTest -I "$GITHUB_WORKSPACE/.github/ci/test-jvm.init.gradle" -Pparsson.home=image/parsson-dist -Pparsson.impl=${{ matrix.test_suite }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-results-jdk${{ matrix.java_version }}-${{ matrix.test_suite }}
          path: tck-impl/build/distributions/tck-test-results.zip
          if-no-files-found: ignore
